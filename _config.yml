# GitHub Pages (Jekyll) build config.
# Keep the published site limited to the lectures and the assets they load.
# Files starting with "_" or "." (e.g. _template.html, .env) are skipped by Jekyll automatically.
exclude:
  - "*.md"
  # Narration sources (scripts, voice, lexicon, generator) are build inputs, not site content.
  # Keep the trailing slash: Jekyll also prefix-matches, so plain "narration" would drop narration.js.
  - "narration/"
  - "tools/"
  - "audio/*.align.json"
